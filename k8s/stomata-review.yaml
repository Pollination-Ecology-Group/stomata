apiVersion: apps/v1
kind: Deployment
metadata:
  name: stomata-review
  namespace: stenc-ns
  labels:
    app: stomata-review
    project: stomata
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: stomata-review
  template:
    metadata:
      labels:
        app: stomata-review
        project: stomata
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ultralytics/ultralytics:latest
        imagePullPolicy: IfNotPresent
        workingDir: /tmp
        command:
          - "sh"
          - "-c"
          - |
            pip install --user --quiet --no-warn-script-location flask boto3 waitress || exit 1
            python3 -c "import boto3, os, urllib3; urllib3.disable_warnings(); s3 = boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT'], aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'], verify=False); s3.download_file(os.environ['S3_BUCKET'], 'Ostatni/YOLO_flies/mobile_sam.pt', '/tmp/mobile_sam.pt')" || true
            cd /app && exec python -m waitress --port=8080 --threads=8 app:app
        ports:
          - containerPort: 8080
        env:
          - name: HOME
            value: /tmp
          - name: SAM_WEIGHTS
            value: /tmp/mobile_sam.pt
          - name: S3_ENDPOINT
            value: "https://s3.cl4.du.cesnet.cz"
          - name: S3_BUCKET
            value: "peg-bucket"
          - name: REVIEW_PREFIX
            value: "Ostatni/Stomata/Review"
          - name: REVIEW_USERS_JSON
            valueFrom:
              secretKeyRef:
                name: viability-review-users
                key: users.json
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access-key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secret-key
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
        - name: app
          mountPath: /app
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: app
        configMap:
          name: stomata-review-src
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stomata-review
  namespace: stenc-ns
  labels:
    app: stomata-review
spec:
  selector:
    app: stomata-review
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stomata-review
  namespace: stenc-ns
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stomata-review-stenc.dyn.cloud.e-infra.cz
      secretName: stomata-review-stenc-dyn-cloud-e-infra-cz-tls
  rules:
    - host: stomata-review-stenc.dyn.cloud.e-infra.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stomata-review
                port:
                  number: 80
