apiVersion: batch/v1
kind: Job
metadata:
  name: stomata-train-job
  namespace: stenc-ns
spec:
  backoffLimit: 0
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: stomata-trainer
        image: ultralytics/ultralytics:latest
        imagePullPolicy: IfNotPresent
        workingDir: /tmp
        command:
          - /bin/bash
          - -c
          - |
            set -e
            export HOME=/tmp
            export PATH=$PATH:$HOME/.local/bin
            echo "Installing required Python dependencies..."
            pip install --user boto3 pyyaml albumentations openpyxl shapely pandas --quiet
            # From here on, any failure writes a FAILED marker so the report job e-mails a notice
            trap 'echo "[!] Pipeline failed"; python3 /scripts/pipeline_marker.py FAILED || true' ERR
            echo "Configuring Ultralytics writable paths..."
            mkdir -p /tmp/stomata_train/weights /tmp/stomata_train/runs /tmp/stomata_train/datasets
            yolo settings weights_dir='/tmp/stomata_train/weights' runs_dir='/tmp/stomata_train/runs' datasets_dir='/tmp/stomata_train/datasets'

            echo "============================================================"
            echo "STEP 0: Archiving previous inference results (RUN_ID=${RUN_ID})"
            echo "============================================================"
            python3 /scripts/pipeline_marker.py ARCHIVE
            
            echo "============================================================"
            echo "STEP 1: Retraining Stomata YOLOv11 Model (latest staged dataset + backgrounds)"
            echo "============================================================"
            cd /tmp/stomata_train
            python3 /scripts/train_stomata_s3.py

            echo "============================================================"
            echo "STEP 2: Full Batch Trait Extraction Across 3,253 Micrographs"
            echo "============================================================"
            cp /scripts/extract_traits.py /tmp/stomata_train/extract_traits.py
            python3 /scripts/run_stomata_full_inference.py

            echo "STEP 3: Signalling report job"
            python3 /scripts/pipeline_marker.py DONE
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: s3-creds
        - secretRef:
            name: email-credentials
        env:
          - name: S3_ENDPOINT
            value: "https://s3.cl4.du.cesnet.cz"
          - name: RUN_ID
            value: "v8-20261022"
          - name: S3_BUCKET
            value: "peg-bucket"
          - name: S3_STAGED_PREFIX
            value: "Ostatni/Stomata/staged_area/"
          - name: S3_BACKGROUNDS_PREFIX
            value: "Ostatni/Stomata/backgrounds/"
          - name: S3_MODELS_PREFIX
            value: "Ostatni/Stomata/trained_models/"
          - name: S3_RUNS_PREFIX
            value: "Ostatni/Stomata/training_runs/"
          - name: BASE_MODEL
            value: "yolo11m-seg.pt"
          - name: EPOCHS
            value: "120"
          - name: BATCH_SIZE
            value: "16"
          - name: IMG_SIZE
            value: "640"
          - name: PATIENCE
            value: "30"
          - name: VAL_SPLIT
            value: "0.15"
          - name: EMAIL_RECIPIENT
            value: "jakubstenc@gmail.com"
          - name: S3_META_KEY
            value: "Ostatni/Stomata/metadata/stomata_sampling_trait_comparison_by_sample.xlsx"
          - name: S3_OUTPUT_PREFIX
            value: "Ostatni/Stomata/inference_results"
          - name: FETCH_WORKERS
            value: "16"
          - name: MIN_FOCUS
            value: "2.8"
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
            nvidia.com/gpu: "1"
          limits:
            memory: "24Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: tmp-volume
          mountPath: /tmp
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: tmp-volume
        emptyDir:
          sizeLimit: 40Gi
      - name: script-volume
        configMap:
          name: stomata-train-script
      restartPolicy: Never
